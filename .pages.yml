media:
  input: public/images/menu
  output: /images/menu
  extensions: [jpg, jpeg, png, webp, avif]
  rename: safe

content:
  - name: categories
    label: Menu categories
    type: collection
    path: content/categories
    format: json
    filename: "{fields.slug}.json"
    view:
      primary: name
      fields: [name, display_order, is_active]
    fields:
      - { name: id, label: Permanent ID, type: uuid, options: { editable: false, generate: false } }
      - { name: name, label: Category name, type: string, required: true }
      - { name: slug, label: URL slug, type: string, required: true, description: "Use lowercase words separated by hyphens. Existing category links use this value." }
      - { name: image_url, label: Shared category photo, type: image }
      - { name: display_order, label: Display order, type: number, required: true, default: 1 }
      - { name: is_active, label: Show category on the menu, type: boolean, default: true }
  - name: menu
    label: Menu dishes
    type: file
    path: content/menu.json
    format: json
    fields:
      - name: items
        label: Dishes
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{fields.name} · ₹{fields.price}"
        fields:
          - { name: id, label: Permanent ID, type: uuid, options: { editable: false, generate: false } }
          - { name: name, label: Dish name, type: string, required: true }
          - name: category_id
            label: Category
            type: reference
            required: true
            options:
              collection: categories
              search: fields.name
              label: "{fields.name}"
              value: "{fields.id}"
          - { name: slug, label: Dish slug, type: string, required: true, description: "Use a unique lowercase name with hyphens." }
          - { name: description, label: Description, type: text }
          - { name: price, label: Price in rupees, type: number, required: true, options: { min: 0 } }
          - { name: image_url, label: Dish photo, type: image, description: "Leave empty to show the shared category photo." }
          - { name: is_available, label: Available to order, type: boolean, default: true }
          - { name: is_featured, label: Feature on homepage, type: boolean, default: false }
          - { name: display_order, label: Display order, type: number, required: true, default: 1 }
